name: Flow locks research branch
on:
  push:
    branches: [standalone-flow-locks-v1]
    paths:
      - "flow_locks/**"
      - ".github/workflows/flow-locks-branch.yml"
  workflow_dispatch:

concurrency:
  group: flow-locks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline unit tests
        run: python -m unittest discover -s flow_locks/tests -v

  after-close-review:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Analyze latest close and next trading session
        run: python -m flow_locks.close_review --out post-close.json
      - name: Evaluate strict next-session research gate
        if: always()
        run: python -m flow_locks.next_session --input post-close.json --out next-session.json --capital 10000 --risk 100
      - name: Explain next-session candidate status
        if: always()
        run: python -m flow_locks.close_summary post-close.json
      - name: Save research-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-session-research
          path: |
            post-close.json
            next-session.json
          retention-days: 3
          if-no-files-found: warn

  market-discovery:
    needs: [verify, after-close-review]
    if: ${{ always() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan A-share market snapshot (full pagination)
        run: python -m flow_locks.market_scan --deep 5 --page-delay 0.4 --out market-snapshot.json
      - name: Publish ranking and completeness status
        if: always()
        run: python -m flow_locks.market_summary market-snapshot.json
      - name: Save audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-discovery
          path: market-snapshot.json
          retention-days: 2
          if-no-files-found: warn
