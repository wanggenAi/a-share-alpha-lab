name: Flow locks branch probe
on:
  push:
    branches: [standalone-flow-locks-v1]
    paths:
      - "flow_locks/**"
      - ".github/workflows/flow-locks-branch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline unit tests
        run: python -m unittest discover -s flow_locks/tests -v
      - name: Fetch public market data (best effort)
        run: python -m flow_locks.cli --symbols 000100 600206 603993 --json-out flow-snapshot.json
      - name: Show signal evidence in Actions summary
        if: always()
        run: python -m flow_locks.summary flow-snapshot.json
      - name: Upload observed snapshot (if returned)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-snapshot
          path: flow-snapshot.json
          retention-days: 2
          if-no-files-found: warn

  market-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify unit tests first
        run: python -m unittest discover -s flow_locks/tests -v
      - name: Scan A-share market snapshot (full pagination)
        run: python -m flow_locks.market_scan --deep 5 --page-delay 0.22 --out market-snapshot.json
      - name: Publish market ranking and data coverage
        if: always()
        run: python -m flow_locks.market_summary market-snapshot.json
      - name: Save audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-discovery
          path: market-snapshot.json
          retention-days: 2
          if-no-files-found: warn
