[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-alpha-lab"
version = "0.6.0"
description = "Evidence-driven A-share research starter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
data = ["akshare>=1.13", "pandas>=2"]

[project.scripts]
alpha-lab = "alpha_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
